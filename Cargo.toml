[package]
name = "lazyvial"
version = "0.1.6"
edition = "2021"
description = "Remap a Vial keyboard from the terminal"
license = "MIT"
repository = "https://github.com/imjma/lazyvial"
homepage = "https://github.com/imjma/lazyvial"
readme = "README.md"
keywords = ["vial", "qmk", "keyboard", "keymap", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
crossterm = "0.28"
hidapi = "2"
serde_json = "1"
xz2 = "0.1"
