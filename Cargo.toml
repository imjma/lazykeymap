[package]
name = "lazykeymap"
version = "0.3.0"
edition = "2021"
description = "Remap a Vial or ZMK Studio keyboard from the terminal"
license = "MIT"
repository = "https://github.com/imjma/lazykeymap"
readme = "README.md"
keywords = ["vial", "qmk", "zmk", "keymap", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
btleplug = "0.13.5"
crossterm = "0.28"
futures = "0.3.34"
hidapi = "2"
serde_json = "1"
serialport = "4"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }
uuid = "1.29.3"
xz2 = "0.1"
