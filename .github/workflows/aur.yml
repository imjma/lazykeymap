name: aur

# Each release tag publishes aur/PKGBUILD to the AUR at that version, so `yay -Syu` picks it up.
# Run it by hand with a tag to publish one again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, as v0.6.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          sed -i "s/^pkgver=.*/pkgver=${tag#v}/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          grep -E '^(pkgver|pkgrel)=' aur/PKGBUILD
      # updpkgsums hashes the tag's tarball; the test build installs cargo and builds it in Arch
      # first, so a broken PKGBUILD never reaches the AUR; the action writes .SRCINFO, then pushes.
      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: lazykeymap
          pkgbuild: ./aur/PKGBUILD
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: lazykeymap ${{ github.event.inputs.tag || github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
